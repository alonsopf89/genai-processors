# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install .[contrib]
        pip install .[dev]
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # We run other checks in advisory mode, so --xit-zero treats all errors as warning.
        # Line length is enforced by internal pylint so here we set a very generous limit.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=500 --indent-size=2 --statistics
    - name: Test with pytest
      run: |
        pytest

  publish-pypi:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: Build and check PyPI version
      id: check_version
      run: |
        python -m pip install --upgrade pip build twine packaging
        python -m build
        LOCAL_VER=$(python -c "import glob, os; whl=glob.glob('dist/*.whl')[0]; print(os.path.basename(whl).split('-')[1])")
        PYPI_VER=$(python -c "import json, urllib.request; print(json.loads(urllib.request.urlopen('https://pypi.org/pypi/genai-processors/json').read())['info']['version'])")
        echo "Local: $LOCAL_VER, PyPI: $PYPI_VER"
        if python -c "from packaging.version import Version; exit(0 if Version('$LOCAL_VER') > Version('$PYPI_VER') else 1)"; then
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Authenticate to Google Cloud (OSS Exit Gate)
      if: steps.check_version.outputs.should_publish == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

    - name: Set up Cloud SDK
      if: steps.check_version.outputs.should_publish == 'true'
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: Clean up failed staging attempt for this exact version (if any)
      if: steps.check_version.outputs.should_publish == 'true'
      run: |
        python3 - <<'PY'
        import email, glob, re, subprocess, tarfile, zipfile
        seen = set()
        for f in sorted(glob.glob("dist/**/*.whl", recursive=True) + glob.glob("dist/**/*.tar.gz", recursive=True)):
          try:
            if f.endswith(".whl"):
              with zipfile.ZipFile(f) as zf:
                meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")][0]
                msg = email.message_from_bytes(zf.read(meta))
            else:
              with tarfile.open(f) as tf:
                info = [m for m in tf.getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]
                msg = email.message_from_bytes(tf.extractfile(info).read())
            pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
            ver = msg["Version"].strip()
          except Exception:
            continue
          if (pkg, ver) in seen:
            continue
          seen.add((pkg, ver))
          if subprocess.run([
              "gcloud", "artifacts", "versions", "describe", ver,
              f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=genai-processors--pypi"
          ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:
            subprocess.run([
                "gcloud", "artifacts", "versions", "delete", ver,
                f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=genai-processors--pypi", "--quiet"
            ], check=False)
        PY

    - name: Stage to OSS Exit Gate and upload manifest
      if: steps.check_version.outputs.should_publish == 'true'
      run: |
        TWINE_PASSWORD="$(gcloud auth print-access-token)"
        echo "::add-mask::${TWINE_PASSWORD}"
        python -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/genai-processors--pypi/" \
          -u oauth2accesstoken \
          -p "${TWINE_PASSWORD}" \
          dist/*
        python3 - dist/* <<'PY'
        import email, json, re, sys, tarfile, zipfile
        pairs = set()
        for path in sys.argv[1:]:
          if path.endswith(".whl"):
            with zipfile.ZipFile(path) as zf:
              for name in zf.namelist():
                if name.endswith(".dist-info/METADATA"):
                  msg = email.message_from_bytes(zf.read(name))
                  pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                  pairs.add((pkg, msg["Version"].strip()))
                  break
          elif path.endswith(".tar.gz"):
            with tarfile.open(path, "r:gz") as tf:
              for member in tf.getmembers():
                if member.name.endswith("/PKG-INFO") and member.name.count("/") == 1:
                  f = tf.extractfile(member)
                  if f is not None:
                    msg = email.message_from_bytes(f.read())
                    pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                    pairs.add((pkg, msg["Version"].strip()))
                  break
        if not pairs:
          raise SystemExit("ERROR: No .whl/.tar.gz package metadata found for manifest.json")
        manifest = {
            "publish_all": False,
            "publishing_groups": [{
                "packages": [{"name": pkg, "version": ver} for pkg, ver in sorted(pairs)]
            }],
        }
        with open("manifest.json", "w", encoding="utf-8") as fh:
          json.dump(manifest, fh, indent=2)
          fh.write("\n")
        PY
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/genai-processors/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
